<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Paiements - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Paiements</h4>
            <button id="crud-add-btn" class="btn btn-primary">+ Ajouter</button>
        </div>
        <div id="crud-alert" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr id="crud-thead-row"></tr>
                </thead>
                <tbody id="crud-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/modal :: modal}"></div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script th:inline="javascript">
    const crudConfig = {
        apiUrl: "/api/payements",
        idKey: "id",
        columns: [
            { key: "id", label: "ID", type: "text" },
            { key: "idLigneCommande", label: "Ligne de commande", type: "text" },
            { key: "nomTypePayement", label: "Type de paiement", type: "text" },
            { key: "montant", label: "Montant", type: "money" },
            { key: "dateModification", label: "Modifie le", type: "date" },
        ],
        fields: [
            { key: "idLigneCommande", label: "Ligne de commande", type: "select", required: true, select: { url: "/api/ligne-commandes", valueKey: "id", labelFormat: function(o) { return 'Ligne #' + o.id + (o.prix !== undefined && o.prix !== null ? (' - ' + o.prix) : ''); } } },
            { key: "idTypePayement", label: "Type de paiement", type: "select", required: true, select: { url: "/api/type-payements", valueKey: "id", labelFormat: function(o) { return (o.nom || ''); } } },
            { key: "montant", label: "Montant", type: "number", required: true, step: "0.01" },
        ]
    };
    document.addEventListener('DOMContentLoaded', function () {
        CrudPage.init(crudConfig);
    });
</script>
</body>
</html>
