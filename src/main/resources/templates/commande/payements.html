<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Paiements - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editPayement != null ? 'Modifier le paiement' : 'Ajouter un paiement'}">Ajouter un paiement</h4>
        <form th:action="@{/commandes/payements/save}" method="post">
            <input type="hidden" name="id" th:value="${editPayement?.id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Ligne de commande *</label>
                    <select name="idLigneCommande" class="form-select" required>
                        <option value="" th:selected="${editPayement?.idLigneCommande == null}">-- Choisir --</option>
                        <option th:each="l : ${lignes}"
                                th:value="${l.id}"
                                th:text="'Ligne #' + ${l.id} + (${l.prix} != null ? ' - ' + ${l.prix} : '')"
                                th:selected="${editPayement?.idLigneCommande == l.id}">Ligne</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Type de paiement *</label>
                    <select name="idTypePayement" class="form-select" required>
                        <option value="" th:selected="${editPayement?.idTypePayement == null}">-- Choisir --</option>
                        <option th:each="t : ${typesPayement}"
                                th:value="${t.id}"
                                th:text="${t.nom}"
                                th:selected="${editPayement?.idTypePayement == t.id}">Type</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Montant *</label>
                    <input type="number" step="0.01" name="montant" class="form-control"
                           th:value="${editPayement?.montant}" required/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/commandes/payements}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Paiements</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ligne de commande</th>
                        <th>Type de paiement</th>
                        <th>Montant</th>
                        <th>Modifie le</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${payements}">
                        <td th:text="${p.id}">1</td>
                        <td th:text="${p.idLigneCommande}">1</td>
                        <td th:text="${p.nomTypePayement}">Type</td>
                        <td th:text="${#numbers.formatDecimal(p.montant, 1, 2)}">0.00</td>
                        <td th:text="${p.dateModification}">Date</td>
                        <td>
                            <a th:href="@{/commandes/payements(edit=${p.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/commandes/payements/delete/{id}(id=${p.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer ce paiement ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(payements)}">
                        <td colspan="6" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
