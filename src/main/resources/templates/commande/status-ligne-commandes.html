<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Statuts de ligne de commande - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editStatusLigne != null ? 'Modifier le statut' : 'Ajouter un statut'}">Ajouter un statut</h4>
        <form th:action="@{/commandes/status-lignes/save}" method="post">
            <input type="hidden" name="id" th:value="${editStatusLigne?.id}"/>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nom *</label>
                    <input type="text" name="nom" class="form-control" th:value="${editStatusLigne?.nom}" required/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/commandes/status-lignes}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Statuts de ligne de commande</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${statusLignes}">
                        <td th:text="${s.id}">1</td>
                        <td th:text="${s.nom}">Nom</td>
                        <td>
                            <a th:href="@{/commandes/status-lignes(edit=${s.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/commandes/status-lignes/delete/{id}(id=${s.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer ce statut ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(statusLignes)}">
                        <td colspan="3" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
