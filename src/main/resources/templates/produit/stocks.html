<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Stocks - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editStock != null ? 'Modifier le stock' : 'Ajouter un stock'}">Ajouter un stock</h4>
        <form th:action="@{/produits/stocks/save}" method="post">
            <input type="hidden" name="id" th:value="${editStock?.id}"/>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Produit *</label>
                    <select name="idProduit" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="p : ${produits}" th:value="${p.id}"
                                th:text="${p.nom}"
                                th:selected="${editStock != null && editStock.idProduit == p.id}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Prix d achat *</label>
                    <input type="number" step="0.01" name="prixAchat" class="form-control" th:value="${editStock?.prixAchat}" required/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Prix de vente *</label>
                    <input type="number" step="0.01" name="prixVente" class="form-control" th:value="${editStock?.prixVente}" required/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quantite *</label>
                    <input type="number" name="quantiteStock" class="form-control" th:value="${editStock?.quantiteStock}" required/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/produits/stocks}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Stocks</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Produit</th>
                        <th>Prix d achat</th>
                        <th>Prix de vente</th>
                        <th>Quantite</th>
                        <th>Modifie le</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${stocks}">
                        <td th:text="${s.id}">1</td>
                        <td th:text="${s.nomProduit}">Produit</td>
                        <td th:text="${s.prixAchat}">0</td>
                        <td th:text="${s.prixVente}">0</td>
                        <td th:text="${s.quantiteStock}">0</td>
                        <td th:text="${s.dateModification}">-</td>
                        <td>
                            <a th:href="@{/produits/stocks(edit=${s.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/produits/stocks/delete/{id}(id=${s.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer ce stock ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(stocks)}">
                        <td colspan="7" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
