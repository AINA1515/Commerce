<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Stocks - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Stocks</h4>
            <button id="crud-add-btn" class="btn btn-primary">+ Ajouter</button>
        </div>
        <div id="crud-alert" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr id="crud-thead-row"></tr>
                </thead>
                <tbody id="crud-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/modal :: modal}"></div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script th:inline="javascript">
    const crudConfig = {
        apiUrl: "/api/stock-produits",
        idKey: "id",
        columns: [
            { key: "id", label: "ID", type: "text" },
            { key: "nomProduit", label: "Produit", type: "text" },
            { key: "prixAchat", label: "Prix d'achat", type: "money" },
            { key: "prixVente", label: "Prix de vente", type: "money" },
            { key: "quantiteStock", label: "Quantite", type: "text" },
            { key: "dateModification", label: "Modifie le", type: "date" },
        ],
        fields: [
            { key: "idProduit", label: "Produit", type: "select", required: true, select: { url: "/api/produits", valueKey: "id", labelFormat: function(o) { return (o.nom || ''); } } },
            { key: "prixAchat", label: "Prix d'achat", type: "number", required: true, step: "0.01" },
            { key: "prixVente", label: "Prix de vente", type: "number", required: true, step: "0.01" },
            { key: "quantiteStock", label: "Quantite", type: "number", required: true },
        ]
    };
    document.addEventListener('DOMContentLoaded', function () {
        CrudPage.init(crudConfig);
    });
</script>
</body>
</html>
