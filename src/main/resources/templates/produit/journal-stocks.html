<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Journal des stocks - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editJournalStock != null ? 'Modifier la ligne' : 'Ajouter une ligne'}">Ajouter une ligne</h4>
        <form th:action="@{/produits/journal-stocks/save}" method="post">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Produit *</label>
                    <select name="idProduit" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="p : ${produits}" th:value="${p.id}"
                                th:text="${p.nom}"
                                th:selected="${editJournalStock != null && editJournalStock.idProduit == p.id}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Type de transaction *</label>
                    <select name="nomTypeTransactionStock" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="t : ${typesTransactionStock}" th:value="${t.nom}"
                                th:text="${t.nom}"
                                th:selected="${editJournalStock != null && editJournalStock.nomTypeTransactionStock == t.nom}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quantite *</label>
                    <input type="number" name="quantite" class="form-control" th:value="${editJournalStock?.quantite}" required/>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Utilisateur *</label>
                    <select name="idUtilisateur" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="u : ${utilisateurs}" th:value="${u.id}"
                                th:text="${u.nom + ' ' + u.prenom}"
                                th:selected="${editJournalStock != null && editJournalStock.idUtilisateur == u.id}"></option>
                    </select>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/produits/journal-stocks}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Journal des stocks</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Produit</th>
                        <th>Type de transaction</th>
                        <th>Quantite</th>
                        <th>Utilisateur</th>
                        <th>Modifie le</th>
                        <th style="width:160px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="j : ${journalStocks}">
                        <td th:text="${j.nomProduit}">Produit</td>
                        <td th:text="${j.nomTypeTransactionStock}">Type</td>
                        <td th:text="${j.quantite}">0</td>
                        <td th:text="${j.nomUtilisateur}">Utilisateur</td>
                        <td th:text="${j.dateModification}">-</td>
                        <td>
                            <form th:action="@{/produits/journal-stocks/delete/{id}(id=${j.idProduit})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer cette ligne ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(journalStocks)}">
                        <td colspan="6" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
