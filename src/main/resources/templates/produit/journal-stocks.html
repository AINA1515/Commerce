<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Journal des stocks - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Journal des stocks</h4>
            <button id="crud-add-btn" class="btn btn-primary">+ Ajouter</button>
        </div>
        <div id="crud-alert" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr id="crud-thead-row"></tr>
                </thead>
                <tbody id="crud-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/modal :: modal}"></div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script th:inline="javascript">
    const crudConfig = {
        apiUrl: "/api/journal-stocks",
        idKey: "id",
        columns: [
            { key: "id", label: "ID", type: "text" },
            { key: "nomProduit", label: "Produit", type: "text" },
            { key: "nomTypeTransationStock", label: "Type de transaction", type: "text" },
            { key: "quantite", label: "Quantite", type: "text" },
            { key: "nomUtilisateur", label: "Utilisateur", type: "text" },
            { key: "dateModification", label: "Modifie le", type: "date" },
        ],
        fields: [
            { key: "idProduit", label: "Produit", type: "select", required: true, select: { url: "/api/produits", valueKey: "id", labelFormat: function(o) { return (o.nom || ''); } } },
            { key: "idTypeTransationStock", label: "Type de transaction", type: "select", required: true, select: { url: "/api/type-transation-stocks", valueKey: "id", labelFormat: function(o) { return (o.nom || ''); } } },
            { key: "quantite", label: "Quantite", type: "number", required: true },
            { key: "idUtilisateur", label: "Utilisateur", type: "select", required: true, select: { url: "/api/utilisateurs", valueKey: "id", labelFormat: function(o) { return (o.nom || '') + ' ' + (o.prenom || ''); } } },
        ]
    };
    document.addEventListener('DOMContentLoaded', function () {
        CrudPage.init(crudConfig);
    });
</script>
</body>
</html>
