<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Transactions fournisseur - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editTransaction != null ? 'Modifier la transaction' : 'Ajouter une transaction'}">Ajouter une transaction</h4>
        <form th:action="@{/fournisseurs/transactions/save}" method="post">
            <input type="hidden" name="id" th:value="${editTransaction?.id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Type de transaction *</label>
                    <select name="idTypeTransactionFournisseur" class="form-select" required>
                        <option value="" th:selected="${editTransaction?.idTypeTransactionFournisseur == null}">-- Choisir --</option>
                        <option th:each="t : ${typesTransaction}"
                                th:value="${t.id}"
                                th:text="${t.nom}"
                                th:selected="${editTransaction?.idTypeTransactionFournisseur == t.id}">Type</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Utilisateur *</label>
                    <select name="idUtilisateur" class="form-select" required>
                        <option value="" th:selected="${editTransaction?.idUtilisateur == null}">-- Choisir --</option>
                        <option th:each="u : ${utilisateurs}"
                                th:value="${u.id}"
                                th:text="${u.nom + ' ' + u.prenom}"
                                th:selected="${editTransaction?.idUtilisateur == u.id}">Utilisateur</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Montant total *</label>
                    <input type="number" step="0.01" name="montantTotal" class="form-control"
                           th:value="${editTransaction?.montantTotal}" required/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/fournisseurs/transactions}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Transactions fournisseur</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Utilisateur</th>
                        <th>Montant total</th>
                        <th>Modifie le</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${transactions}">
                        <td th:text="${t.id}">1</td>
                        <td th:text="${t.nomTypeTransactionFournisseur}">Type</td>
                        <td th:text="${t.nomUtilisateur}">Utilisateur</td>
                        <td th:text="${#numbers.formatDecimal(t.montantTotal, 1, 2)}">0.00</td>
                        <td th:text="${t.dateModification}">Date</td>
                        <td>
                            <a th:href="@{/fournisseurs/transactions(edit=${t.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/fournisseurs/transactions/delete/{id}(id=${t.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer cette transaction ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="6" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
