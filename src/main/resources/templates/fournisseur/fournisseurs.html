<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Fournisseurs - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editFournisseur != null ? 'Modifier le fournisseur' : 'Ajouter un fournisseur'}">Ajouter un fournisseur</h4>
        <form th:action="@{/fournisseurs/save}" method="post">
            <input type="hidden" name="id" th:value="${editFournisseur?.id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nom *</label>
                    <input type="text" name="nom" class="form-control" th:value="${editFournisseur?.nom}" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Prenom *</label>
                    <input type="text" name="prenom" class="form-control" th:value="${editFournisseur?.prenom}" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" th:value="${editFournisseur?.email}"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Telephone *</label>
                    <input type="text" name="telephone" class="form-control" th:value="${editFournisseur?.telephone}" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Adresse *</label>
                    <input type="text" name="adresse" class="form-control" th:value="${editFournisseur?.adresse}" required/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/fournisseurs}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Fournisseurs</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prenom</th>
                        <th>Email</th>
                        <th>Telephone</th>
                        <th>Adresse</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${fournisseurs}">
                        <td th:text="${f.id}">1</td>
                        <td th:text="${f.nom}">Nom</td>
                        <td th:text="${f.prenom}">Prenom</td>
                        <td th:text="${f.email}">Email</td>
                        <td th:text="${f.telephone}">Telephone</td>
                        <td th:text="${f.adresse}">Adresse</td>
                        <td>
                            <a th:href="@{/fournisseurs(edit=${f.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/fournisseurs/delete/{id}(id=${f.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer ce fournisseur ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(fournisseurs)}">
                        <td colspan="7" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
