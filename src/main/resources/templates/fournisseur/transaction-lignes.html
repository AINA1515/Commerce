<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Lignes de transaction fournisseur - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editLigne != null ? 'Modifier la ligne' : 'Ajouter une ligne'}">Ajouter une ligne</h4>
        <form th:action="@{/fournisseurs/lignes/save}" method="post">
            <input type="hidden" name="id" th:value="${editLigne?.id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Fournisseur *</label>
                    <select name="idFournisseur" class="form-select" required>
                        <option value="" th:selected="${editLigne?.idFournisseur == null}">-- Choisir --</option>
                        <option th:each="f : ${fournisseurs}"
                                th:value="${f.id}"
                                th:text="${f.nom + ' ' + f.prenom}"
                                th:selected="${editLigne?.idFournisseur == f.id}">Fournisseur</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Transaction *</label>
                    <select name="idTransactionFournisseur" class="form-select" required>
                        <option value="" th:selected="${editLigne?.idTransactionFournisseur == null}">-- Choisir --</option>
                        <option th:each="t : ${transactions}"
                                th:value="${t.id}"
                                th:text="'Transaction #' + ${t.id} + ' - ' + ${#numbers.formatDecimal(t.montantTotal, 1, 2)}"
                                th:selected="${editLigne?.idTransactionFournisseur == t.id}">Transaction</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Produit *</label>
                    <select name="idProduit" class="form-select" required>
                        <option value="" th:selected="${editLigne?.idProduit == null}">-- Choisir --</option>
                        <option th:each="p : ${produits}"
                                th:value="${p.id}"
                                th:text="${p.nom}"
                                th:selected="${editLigne?.idProduit == p.id}">Produit</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Quantite *</label>
                    <input type="number" name="quantite" class="form-control"
                           th:value="${editLigne?.quantite}" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Montant *</label>
                    <input type="number" step="0.01" name="montant" class="form-control"
                           th:value="${editLigne?.montant}" required/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/fournisseurs/lignes}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Lignes de transaction fournisseur</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fournisseur</th>
                        <th>Transaction</th>
                        <th>Produit</th>
                        <th>Quantite</th>
                        <th>Montant</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="l : ${lignes}">
                        <td th:text="${l.id}">1</td>
                        <td th:text="${l.nomFournisseur}">Fournisseur</td>
                        <td th:text="'#' + ${l.idTransactionFournisseur}">#1</td>
                        <td th:text="${l.nomProduit}">Produit</td>
                        <td th:text="${l.quantite}">0</td>
                        <td th:text="${#numbers.formatDecimal(l.montant, 1, 2)}">0.00</td>
                        <td>
                            <a th:href="@{/fournisseurs/lignes(edit=${l.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/fournisseurs/lignes/delete/{id}(id=${l.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer cette ligne ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lignes)}">
                        <td colspan="7" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
