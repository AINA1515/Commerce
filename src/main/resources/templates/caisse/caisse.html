<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Caisse - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editCaisse != null ? 'Modifier la caisse' : 'Ajouter une caisse'}">Ajouter une caisse</h4>
        <form th:action="@{/caisse/save}" method="post">
            <input type="hidden" name="id" th:value="${editCaisse?.id}"/>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Solde *</label>
                    <input type="number" step="0.01" name="solde" class="form-control"
                           th:value="${editCaisse?.solde}" required/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/caisse}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Caisse</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Solde</th>
                        <th>Modifie le</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${caisses}">
                        <td th:text="${c.id}">1</td>
                        <td th:text="${#numbers.formatDecimal(c.solde, 1, 2)}">0.00</td>
                        <td th:text="${c.dateModification}">Date</td>
                        <td>
                            <a th:href="@{/caisse(edit=${c.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/caisse/delete/{id}(id=${c.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer cette caisse ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(caisses)}">
                        <td colspan="4" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
