<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Lignes de commande - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editLigne != null ? 'Modifier la ligne' : 'Ajouter une ligne'}">Ajouter une ligne</h4>
        <form th:action="@{/commandes/lignes/save}" method="post">
            <input type="hidden" name="id" th:value="${editLigne?.id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Commande *</label>
                    <select name="idCommande" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="c : ${commandes}" th:value="${c.id}" th:text="'Commande #' + ${c.id} + ' - ' + ${c.prixTotal}"
                                th:selected="${editLigne != null and editLigne.idCommande == c.id}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Produit *</label>
                    <select name="idProduit" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="p : ${produits}" th:value="${p.id}" th:text="${p.nom}"
                                th:selected="${editLigne != null and editLigne.idProduit == p.id}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Quantite *</label>
                    <input type="number" name="quantite" class="form-control" th:value="${editLigne?.quantite}" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Statut *</label>
                    <select name="idStatusLigneCommande" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="s : ${statusLigne}" th:value="${s.id}" th:text="${s.nom}"
                                th:selected="${editLigne != null and editLigne.idStatusLigneCommande == s.id}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Prix *</label>
                    <input type="number" step="0.01" name="prix" class="form-control" th:value="${editLigne?.prix}" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Montant paye</label>
                    <input type="number" step="0.01" name="montantPayee" class="form-control" th:value="${editLigne?.montantPayee}"/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/commandes/lignes}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Lignes de commande</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Commande</th>
                        <th>Produit</th>
                        <th>Quantite</th>
                        <th>Statut</th>
                        <th>Prix</th>
                        <th>Montant paye</th>
                        <th>Modifie le</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="l : ${lignes}">
                        <td th:text="${l.id}">1</td>
                        <td th:text="${l.idCommande}">1</td>
                        <td th:text="${l.nomProduit}">Produit</td>
                        <td th:text="${l.quantite}">0</td>
                        <td th:text="${l.nomStatusLigneCommande}">Statut</td>
                        <td th:text="${l.prix}">0</td>
                        <td th:text="${l.montantPayee}">0</td>
                        <td th:text="${l.dateModification}">-</td>
                        <td>
                            <a th:href="@{/commandes/lignes(edit=${l.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/commandes/lignes/delete/{id}(id=${l.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer cette ligne ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lignes)}">
                        <td colspan="9" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
