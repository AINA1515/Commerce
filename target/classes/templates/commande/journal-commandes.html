<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Journal des commandes - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editJournal != null ? 'Modifier le journal' : 'Ajouter un journal'}">Ajouter un journal</h4>
        <form th:action="@{/commandes/journal/save}" method="post">
            <input type="hidden" name="id" th:value="${editJournal?.id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Commande *</label>
                    <select name="idCommande" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="c : ${commandes}" th:value="${c.id}" th:text="'Commande #' + ${c.id} + ' - ' + ${c.prixTotal}"
                                th:selected="${editJournal != null and editJournal.idCommande == c.id}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Utilisateur *</label>
                    <select name="idUtilisateur" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="u : ${utilisateurs}" th:value="${u.id}" th:text="${u.nom + ' ' + u.prenom}"
                                th:selected="${editJournal != null and editJournal.idUtilisateur == u.id}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Client *</label>
                    <select name="idClient" class="form-select" required>
                        <option value="">-- Choisir --</option>
                        <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.nom + ' ' + c.prenom}"
                                th:selected="${editJournal != null and editJournal.idClient == c.id}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Montant total *</label>
                    <input type="number" step="0.01" name="montantTotal" class="form-control" th:value="${editJournal?.montantTotal}" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Montant paye *</label>
                    <input type="number" step="0.01" name="montantPayee" class="form-control" th:value="${editJournal?.montantPayee}" required/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/commandes/journal}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Journal des commandes</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Commande</th>
                        <th>Utilisateur</th>
                        <th>Client</th>
                        <th>Montant total</th>
                        <th>Montant paye</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="j : ${journals}">
                        <td th:text="${j.id}">1</td>
                        <td th:text="${j.idCommande}">1</td>
                        <td th:text="${j.nomUtilisateur}">Utilisateur</td>
                        <td th:text="${j.nomClient}">Client</td>
                        <td th:text="${j.montantTotal}">0</td>
                        <td th:text="${j.montantPayee}">0</td>
                        <td>
                            <a th:href="@{/commandes/journal(edit=${j.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/commandes/journal/delete/{id}(id=${j.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer ce journal ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(journals)}">
                        <td colspan="7" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
