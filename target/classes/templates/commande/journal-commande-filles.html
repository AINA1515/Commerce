<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Journal des commandes filles - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editJournalFille != null ? 'Modifier le journal fille' : 'Ajouter un journal fille'}">Ajouter un journal fille</h4>
        <form th:action="@{/commandes/journal-filles/save}" method="post">
            <input type="hidden" name="id" th:value="${editJournalFille?.id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Ligne de commande *</label>
                    <select name="idLigneCommande" class="form-select" required>
                        <option value="" th:selected="${editJournalFille?.idLigneCommande == null}">-- Choisir --</option>
                        <option th:each="l : ${lignes}"
                                th:value="${l.id}"
                                th:text="'Ligne #' + ${l.id} + (${l.prix} != null ? ' - ' + ${l.prix} : '')"
                                th:selected="${editJournalFille?.idLigneCommande == l.id}">Ligne</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Utilisateur *</label>
                    <select name="idUtilisateur" class="form-select" required>
                        <option value="" th:selected="${editJournalFille?.idUtilisateur == null}">-- Choisir --</option>
                        <option th:each="u : ${utilisateurs}"
                                th:value="${u.id}"
                                th:text="${u.nom + ' ' + u.prenom}"
                                th:selected="${editJournalFille?.idUtilisateur == u.id}">Utilisateur</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Client *</label>
                    <select name="idClient" class="form-select" required>
                        <option value="" th:selected="${editJournalFille?.idClient == null}">-- Choisir --</option>
                        <option th:each="c : ${clients}"
                                th:value="${c.id}"
                                th:text="${c.nom + ' ' + c.prenom}"
                                th:selected="${editJournalFille?.idClient == c.id}">Client</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Montant total *</label>
                    <input type="number" step="0.01" name="montantTotal" class="form-control"
                           th:value="${editJournalFille?.montantTotal}" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Montant paye</label>
                    <input type="number" step="0.01" name="montantPayee" class="form-control"
                           th:value="${editJournalFille?.montantPayee}"/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/commandes/journal-filles}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Journal des commandes filles</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ligne de commande</th>
                        <th>Utilisateur</th>
                        <th>Client</th>
                        <th>Montant total</th>
                        <th>Montant paye</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="j : ${journalFilles}">
                        <td th:text="${j.id}">1</td>
                        <td th:text="${j.idLigneCommande}">1</td>
                        <td th:text="${j.nomUtilisateur}">Utilisateur</td>
                        <td th:text="${j.nomClient}">Client</td>
                        <td th:text="${#numbers.formatDecimal(j.montantTotal, 1, 2)}">0.00</td>
                        <td th:text="${#numbers.formatDecimal(j.montantPayee, 1, 2)}">0.00</td>
                        <td>
                            <a th:href="@{/commandes/journal-filles(edit=${j.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/commandes/journal-filles/delete/{id}(id=${j.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer ce journal fille ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(journalFilles)}">
                        <td colspan="7" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
