<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Modal generique de creation/modification. Les champs du formulaire sont
        generes en JavaScript par crud.js a partir de la config de chaque page. */-->
<div th:fragment="modal" class="modal fade" id="crud-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="crud-form">
                <div class="modal-header">
                    <h5 class="modal-title" id="crud-modal-title">Ajouter</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>
                <div class="modal-body">
                    <div id="crud-form-fields"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
