<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Remises - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card mb-4">
        <h4 class="mb-3" th:text="${editRemise != null ? 'Modifier la remise' : 'Ajouter une remise'}">Ajouter une remise</h4>
        <form th:action="@{/remises/save}" method="post">
            <input type="hidden" name="id" th:value="${editRemise?.id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Utilisateur *</label>
                    <select name="idUtilisateur" class="form-select" required>
                        <option value="" th:selected="${editRemise?.idUtilisateur == null}">-- Choisir --</option>
                        <option th:each="u : ${utilisateurs}"
                                th:value="${u.id}"
                                th:text="${u.nom + ' ' + u.prenom}"
                                th:selected="${editRemise?.idUtilisateur == u.id}">Utilisateur</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Produit *</label>
                    <select name="idProduit" class="form-select" required>
                        <option value="" th:selected="${editRemise?.idProduit == null}">-- Choisir --</option>
                        <option th:each="p : ${produits}"
                                th:value="${p.id}"
                                th:text="${p.nom}"
                                th:selected="${editRemise?.idProduit == p.id}">Produit</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Pourcentage *</label>
                    <input type="number" step="0.01" name="pourcentage" class="form-control"
                           th:value="${editRemise?.pourcentage}" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date de debut</label>
                    <input type="date" name="dateDebut" class="form-control"
                           th:value="${editRemise?.dateDebut != null ? #temporals.format(editRemise.dateDebut, 'yyyy-MM-dd') : ''}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date de fin</label>
                    <input type="date" name="dateFin" class="form-control"
                           th:value="${editRemise?.dateFin != null ? #temporals.format(editRemise.dateFin, 'yyyy-MM-dd') : ''}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label d-block">Disponible</label>
                    <input type="checkbox" name="disponiblite" class="form-check-input me-2"
                           th:checked="${editRemise?.disponiblite == true}"/>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/remises}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>

    <div class="app-card">
        <h4 class="mb-3">Remises</h4>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Utilisateur</th>
                        <th>Produit</th>
                        <th>Pourcentage</th>
                        <th>Debut</th>
                        <th>Fin</th>
                        <th>Disponible</th>
                        <th style="width:200px">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${remises}">
                        <td th:text="${r.id}">1</td>
                        <td th:text="${r.nomUtilisateur}">Utilisateur</td>
                        <td th:text="${r.nomProduit}">Produit</td>
                        <td th:text="${#numbers.formatDecimal(r.pourcentage, 1, 2)}">0.00</td>
                        <td th:text="${r.dateDebut}">Date</td>
                        <td th:text="${r.dateFin}">Date</td>
                        <td th:text="${r.disponiblite ? 'Oui' : 'Non'}">Oui</td>
                        <td>
                            <a th:href="@{/remises(edit=${r.id})}" class="btn btn-sm btn-outline-primary me-1">Modifier</a>
                            <form th:action="@{/remises/delete/{id}(id=${r.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Supprimer cette remise ?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(remises)}">
                        <td colspan="8" class="text-center text-muted py-4">Aucune donnee</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
