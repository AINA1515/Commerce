<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: head}"></th:block>
    <title>Lignes de transaction fournisseur - Commerce</title>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container-fluid">
    <div class="app-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Lignes de transaction fournisseur</h4>
            <button id="crud-add-btn" class="btn btn-primary">+ Ajouter</button>
        </div>
        <div id="crud-alert" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr id="crud-thead-row"></tr>
                </thead>
                <tbody id="crud-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/modal :: modal}"></div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
<script th:inline="javascript">
    const crudConfig = {
        apiUrl: "/api/transaction-fournisseur-lignes",
        idKey: null,
        columns: [
            { key: "nomFournisseur", label: "Fournisseur", type: "text" },
            { key: "idTransactionFournisseur", label: "Transaction", type: "text" },
            { key: "nomProduit", label: "Produit", type: "text" },
            { key: "quantite", label: "Quantite", type: "text" },
            { key: "montant", label: "Montant", type: "money" },
            { key: "dateCreation", label: "Cree le", type: "date" },
        ],
        fields: [
            { key: "idFournisseur", label: "ID Fournisseur", type: "number", required: true, placeholder: "Identifiant du fournisseur" },
            { key: "idTransactionFournisseur", label: "Transaction", type: "select", required: true, select: { url: "/api/transactions-fournisseurs", valueKey: "id", labelFormat: function(o) { return 'Transaction #' + o.id + (o.montantTotal !== undefined && o.montantTotal !== null ? (' - ' + o.montantTotal) : ''); } } },
            { key: "idProduit", label: "Produit", type: "select", required: true, select: { url: "/api/produits", valueKey: "id", labelFormat: function(o) { return (o.nom || ''); } } },
            { key: "quantite", label: "Quantite", type: "number", required: true },
            { key: "montant", label: "Montant", type: "number", required: true, step: "0.01" },
        ]
    };
    document.addEventListener('DOMContentLoaded', function () {
        CrudPage.init(crudConfig);
    });
</script>
</body>
</html>
